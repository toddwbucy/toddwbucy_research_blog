# ============================================================================
# Deploy to GitHub Pages
# ============================================================================
# This is the only GitHub-Pages-specific file in the repo. When migrating
# to Cloudflare Pages (Phase 2+), delete this file and configure the build
# in Cloudflare's dashboard:
#   Build command: hugo --gc --minify --baseURL "$CF_PAGES_URL"
#   Output dir:    public
#   Env var:       HUGO_VERSION = 0.161.1
# Everything else (content, theme submodule, archetypes, layouts) is
# host-agnostic and works without modification on either host.
#
# Security note: this workflow only interpolates GitHub-controlled outputs
# (runner.temp, configure-pages outputs, deploy-pages outputs) into its
# run blocks. No issue/PR/commit-message data is used, so the workflow-
# injection vectors documented at
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# do not apply.
# ============================================================================

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.161.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (extended)
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: America/Chicago
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo --gc --minify --baseURL "${PAGES_BASE_URL}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
